<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laboratorio de Ideas | 3D Troubleshooting & Slicer Hub</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#a855f7', 600: '#9333ea' }, // Violeta Neón principal
            lab: { 400: '#22d3ee', 500: '#06b6d4' }    // Cian / Turquesa Eléctrico
          }
        }
      }
    }
  </script>
</head>
<body class="bg-black text-slate-100 flex flex-col min-h-screen font-sans pb-20 md:pb-0 relative overflow-x-hidden bg-cover bg-center bg-fixed bg-no-repeat" style="background-image: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(15,15,15,0.9) 50%, rgba(20,20,20,0.9) 100%), url('https://images.unsplash.com/photo-1572019409893-eb471ed277f0?q=80&w=1920');">
  
  <!-- Overlay adicional de textura grid Cyberpunk opcional -->
  <div class="fixed inset-0 pointer-events-none z-0" style="background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px); background-size: 40px 40px;"></div>

  <!-- Contenedor Principal con z-10 para estar sobre el overlay -->
  <div class="relative z-10 flex flex-col min-h-screen">
    
    <!-- Header -->
    <header class="bg-zinc-950/85 backdrop-blur-md border-b border-purple-500/25 sticky top-0 z-50 shadow-[0_0_15px_rgba(168,85,247,0.15)]">
      <!-- ... Resto del header sin cambios ... -->
    </header>

    <!-- Banner Publicitario Header -->
    <div class="max-w-6xl mx-auto w-full px-4 mt-4">
      <div class="border border-cyan-500/35 bg-zinc-900/80 hover:bg-zinc-900/90 transition rounded-xl p-3.5 text-center shadow-[0_0_15px_rgba(6,182,212,0.15)] relative overflow-hidden group">
        <!-- ... Resto del banner sin cambios ... -->
      </div>
    </div>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto w-full px-4 py-6 flex-grow grid grid-cols-1 md:grid-cols-4 gap-6">
      
      <!-- Sidebar / Selector de Máquina -->
      <aside class="md:col-span-1 space-y-4">
        <div class="bg-zinc-900/85 border border-purple-500/20 rounded-xl p-4 shadow-[0_0_10px_rgba(168,85,247,0.05)] backdrop-blur-sm">
          <!-- ... Resto de la aside sin cambios ... -->
        </div>
      </aside>

      <!-- Main Troubleshooting Area -->
      <section class="md:col-span-3 space-y-4">
        <!-- Search Input con Lupa -->
        <div class="relative flex items-center w-full">
          <input 
            type="text" 
            id="input-search" 
            placeholder="Escribí tu problema..." 
            class="w-full bg-zinc-900/80 border border-purple-500/25 rounded-xl pl-4 pr-10 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-lab-400 focus:shadow-[0_0_10px_rgba(34,211,238,0.25)] backdrop-blur-sm transition" 
          />
          <!-- ... Botón de búsqueda sin cambios ... -->
        </div>
        <!-- ... Etapas de diagnóstico ... -->
        
        <!-- Result List Container -->
        <div id="troubleshoot-cards" class="space-y-4">
          <!-- Render dinámico: Asegurate de usar bg-zinc-900/85 para las tarjetas dinámicas en app.js -->
        </div>
      </section>
    </main>

    <!-- ... Resto de tu HTML (Modal, Nav Mobile, Scripts) ... -->
    
  </div> <!-- Cierre del div z-10 relative principal -->
</body>

  <!-- Header -->
  <header class="bg-zinc-950/90 backdrop-blur border-b border-purple-500/30 sticky top-0 z-50 shadow-[0_0_15px_rgba(168,85,247,0.15)]">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="text-2xl drop-shadow-[0_0_8px_rgba(34,211,238,0.8)]">🔬</span>
        <div>
          <h1 class="font-bold text-lg leading-none tracking-tight text-white">
            LABORATORIO DE IDEAS <span class="text-xs text-lab-400 font-mono drop-shadow-[0_0_5px_rgba(34,211,238,0.8)]">&lt;3D/&gt;</span>
          </h1>
          <p class="text-xs text-slate-400">Experimentá, calibrá e imprimí sin fallas.</p>
        </div>
      </div>
      
      <!-- Registro Maker -->
      <div class="flex items-center space-x-4">
        <button id="btn-abrir-registro" onclick="toggleModal(true)" type="button" class="bg-brand-500 hover:bg-brand-600 text-white text-xs px-4 py-2 rounded-lg font-semibold transition flex items-center gap-2 shadow-[0_0_12px_rgba(168,85,247,0.5)] cursor-pointer border border-purple-400/30">
          <span>👤</span> Registrarme
        </button>
      </div>
    </div>
  </header>

  <!-- Banner Publicitario Header -->
  <div class="max-w-6xl mx-auto w-full px-4 mt-4">
    <div class="border border-cyan-500/40 bg-zinc-900/90 hover:bg-zinc-900 transition rounded-xl p-3.5 text-center shadow-[0_0_15px_rgba(6,182,212,0.15)] relative overflow-hidden group">
      <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-cyan-500/10 rounded-full blur-xl pointer-events-none"></div>
      <a id="sponsor-link" href="#" target="_blank" rel="noopener noreferrer" class="block">
        <span id="sponsor-badge" class="inline-block text-[10px] font-mono font-bold uppercase tracking-wider bg-cyan-500/20 text-lab-400 px-2 py-0.5 rounded-full border border-cyan-500/40 mb-1.5 shadow-[0_0_8px_rgba(34,211,238,0.3)]">
          SPONSOR OFICIAL
        </span>
        <p id="sponsor-text" class="text-xs md:text-sm font-semibold text-slate-200 group-hover:text-lab-400 transition-colors">
          Cargando promociones...
        </p>
      </a>
    </div>
  </div>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto w-full px-4 py-6 flex-grow grid grid-cols-1 md:grid-cols-4 gap-6">
    
    <!-- Sidebar / Selector de Máquina -->
    <aside class="md:col-span-1 space-y-4">
      <div class="bg-zinc-900/90 border border-purple-500/20 rounded-xl p-4 shadow-[0_0_10px_rgba(168,85,247,0.05)]">
        <h2 class="text-sm font-semibold text-lab-400 mb-3 flex items-center gap-2">
          <span>⚙️</span> Mi Equipamiento
        </h2>
        <div class="space-y-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1">Arquitectura / Marca</label>
            <select id="select-printer" class="w-full bg-black border border-zinc-700 rounded-lg p-2 text-slate-200 focus:outline-none focus:border-lab-400">
              <option value="all">Todas las impresoras</option>
              <option value="bambu">Bambu Lab (A1/P1S/AMS)</option>
              <option value="creality">Creality (Ender 3 / K1)</option>
              <option value="elegoo">Elegoo Neptune</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Sistema Extrusión</label>
            <select id="select-extruder" class="w-full bg-black border border-zinc-700 rounded-lg p-2 text-slate-200 focus:outline-none focus:border-lab-400">
              <option value="all">Todos</option>
              <option value="direct">Directa (Direct Drive)</option>
              <option value="bowden">Bowden</option>
            </select>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Troubleshooting Area -->
    <section class="md:col-span-3 space-y-4">
      <!-- Search Input con Lupa -->
      <div class="relative flex items-center w-full">
        <input 
          type="text" 
          id="input-search" 
          placeholder="Escribí tu problema (ej: 'ruido tac-tac', 'pelitos', 'no pega la 1ra capa')..." 
          class="w-full bg-zinc-900 border border-purple-500/30 rounded-xl pl-4 pr-10 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-lab-400 focus:shadow-[0_0_10px_rgba(34,211,238,0.3)] transition" 
        />
        <button 
          id="btn-search" 
          type="button" 
          class="absolute right-3 text-slate-400 hover:text-lab-400 transition cursor-pointer flex items-center justify-center p-1"
          title="Buscar"
        >
          🔍
        </button>
      </div>

      <!-- Etapas de Diagnóstico -->
      <div class="flex gap-2 overflow-x-auto pb-2 text-xs scrollbar-none">
        <button class="stage-btn active bg-brand-500 text-white px-3 py-1.5 rounded-lg whitespace-nowrap shadow-[0_0_10px_rgba(168,85,247,0.4)] border border-purple-400/30" data-stage="ALL">Todas las etapas</button>
        <button class="stage-btn bg-zinc-900 text-slate-400 px-3 py-1.5 rounded-lg whitespace-nowrap border border-zinc-800 hover:border-purple-500/40" data-stage="PRIMERA_CAPA">1. Capa y Adherencia</button>
        <button class="stage-btn bg-zinc-900 text-slate-400 px-3 py-1.5 rounded-lg whitespace-nowrap border border-zinc-800 hover:border-purple-500/40" data-stage="EXTRUSION">2. Extrusión y Flujo</button>
        <button class="stage-btn bg-zinc-900 text-slate-400 px-3 py-1.5 rounded-lg whitespace-nowrap border border-zinc-800 hover:border-purple-500/40" data-stage="TERMICA">3. Térmica / Humedad</button>
        <button class="stage-btn bg-zinc-900 text-slate-400 px-3 py-1.5 rounded-lg whitespace-nowrap border border-zinc-800 hover:border-purple-500/40" data-stage="4. Mecánica">4. Mecánica</button>
        <button class="stage-btn bg-zinc-900 text-slate-400 px-3 py-1.5 rounded-lg whitespace-nowrap border border-zinc-800 hover:border-purple-500/40" data-stage="SLICER">5. Slicer / Parámetros</button>
      </div>

      <!-- Result List Container -->
      <div id="troubleshoot-cards" class="space-y-4">
        <!-- Render dinámico desde troubleshooting.json -->
      </div>
    </section>

  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-zinc-950 border-t border-purple-500/30 flex justify-around py-2 z-50">
    <a href="#" class="flex flex-col items-center text-xs text-brand-500">
      <span>🔬</span>
      <span>Diagnóstico</span>
    </a>
    <a href="#" class="flex flex-col items-center text-xs text-slate-400">
      <span>🎛️</span>
      <span>Slicers</span>
    </a>
    <a href="#" onclick="toggleModal(true); return false;" class="flex flex-col items-center text-xs text-slate-400">
      <span>👤</span>
      <span>Perfil</span>
    </a>
  </nav>

  <!-- Modal de Registro Maker -->
  <div id="modal-registro" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
    <div class="bg-zinc-900 border border-lab-500/50 rounded-2xl p-6 max-w-md w-full shadow-[0_0_25px_rgba(6,182,212,0.25)] relative">
      <button onclick="toggleModal(false)" type="button" class="absolute top-4 right-4 text-slate-400 hover:text-white text-sm cursor-pointer">✕</button>
      
      <h3 class="text-lg font-bold text-slate-100 mb-1 flex items-center gap-2">
        <span>👤</span> Registro Maker
      </h3>
      <p class="text-xs text-slate-400 mb-4">Sumate a la base del laboratorio para recibir novedades, capacitaciones y red de soporte.</p>

      <form id="form-registro" onsubmit="enviarAGoogleSheet(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Nombre y Apellido</label>
          <input type="text" id="reg-nombre" required placeholder="Ej: Alberto Barrera" class="w-full bg-black border border-zinc-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-lab-400">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Email / WhatsApp</label>
          <input type="text" id="reg-contacto" required placeholder="Ej: 3871234567 / contacto@mail.com" class="w-full bg-black border border-zinc-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-lab-400">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Tu Impresora / Rol</label>
          <input type="text" id="reg-equipo" placeholder="Ej: Ender 3 / Servicio de impresión" class="w-full bg-black border border-zinc-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-lab-400">
        </div>

        <button id="btn-submit" type="submit" class="w-full bg-lab-500 hover:bg-lab-400 text-black font-bold py-2.5 rounded-lg text-xs transition mt-2 flex items-center justify-center gap-2 cursor-pointer shadow-[0_0_15px_rgba(34,211,238,0.5)]">
          <span>Guardar Registro</span>
        </button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
