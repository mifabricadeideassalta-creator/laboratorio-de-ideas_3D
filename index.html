<!DOCTYPE html>
<html lang="es" class="dark">

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#a855f7', 600: '#9333ea' }, // Violeta Neón principal
            lab: { 400: '#22d3ee', 500: '#06b6d4' }    // Cian / Turquesa Eléctrico
          }
        }
      }
    }
  </script>
</head>
<body class="bg-black text-slate-100 flex flex-col min-h-screen font-sans pb-20 md:pb-0 relative overflow-x-hidden bg-cover bg-center bg-fixed bg-no-repeat" style="background-image: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(10,10,10,0.92)), url('fondo-taller.jpg');">

  <!-- Contenedor Principal en orden natural vertical -->

    <!-- Header -->

            <span>👤</span> Registrarme

      </div>

    <!-- Banner Publicitario Header -->
