<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laboratorio de Ideas | 3D Troubleshooting & Slicer Hub</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#2563eb', 600: '#1d4ed8' },
            lab: { 400: '#34d399', 500: '#10b981' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col min-h-screen font-sans pb-20 md:pb-0">

  <!-- Header -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🔬</span>
        <div>
          <h1 class="font-bold text-lg leading-none tracking-tight text-white">
            LABORATORIO DE IDEAS <span class="text-xs text-lab-400 font-mono">&lt;3D/&gt;</span>
          </h1>
          <p class="text-xs text-slate-400">Experimentá, calibrá e imprimí sin fallas.</p>
        </div>
      </div>
      
      <!-- Counter & Auth -->
      <div class="flex items-center space-x-4">
        <div class="hidden sm:flex items-center space-x-2 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-700">
          <span class="w-2 h-2 rounded-full bg-lab-400 animate-pulse"></span>
          <span id="user-count" class="text-xs font-mono text-slate-300">Cargando...</span>
        </div>
        <button id="btn-login" class="bg-brand-500 hover:bg-brand-600 text-white text-xs px-3 py-2 rounded-lg font-medium transition">
          Ingresar con Google
        </button>
      </div>
    </div>
  </header>

  <!-- Banner Publicitario Header -->
  <div class="max-w-6xl mx-auto w-full px-4 mt-4">
    <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-3 text-center text-xs text-slate-500 min-h-[60px] flex items-center justify-center">
      <span>📢 ESPACIO PUBLICITARIO / SPONSOR LOCAL</span>
    </div>
  </div>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto w-full px-4 py-6 flex-grow grid grid-cols-1 md:grid-cols-4 gap-6">
    
    <!-- Sidebar / Selector de Máquina -->
    <aside class="md:col-span-1 space-y-4">
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
        <h2 class="text-sm font-semibold text-slate-300 mb-3 flex items-center gap-2">
          <span>⚙️</span> Mi Equipamiento
        </h2>
        <div class="space-y-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1">Arquitectura / Marca</label>
            <select id="select-printer" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-200">
              <option value="all">Todas las impresoras</option>
              <option value="bambu">Bambu Lab (A1/P1S/AMS)</option>
              <option value="creality">Creality (Ender 3 / K1)</option>
              <option value="elegoo">Elegoo Neptune</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Sistema Extrusión</label>
            <select id="select-extruder" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-200">
              <option value="all">Todos</option>
              <option value="direct">Directa (Direct Drive)</option>
              <option value="bowden">Bowden</option>
            </select>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Troubleshooting Area -->
    <section class="md:col-span-3 space-y-4">
      <!-- Search Input -->
      <div class="relative">
        <input type="text" id="input-search" placeholder="Escribí tu problema (ej: 'ruido tac-tac', 'pelitos', 'no pega la 1ra capa')..." 
               class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-brand-500 transition" />
        <span class="absolute right-3 top-3 text-slate-500">🔍</span>
      </div>

      <!-- Etapas de Diagnóstico -->
      <div class="flex gap-2 overflow-x-auto pb-2 text-xs scrollbar-none">
        <button class="stage-btn active bg-brand-500 text-white px-3 py-1.5 rounded-lg whitespace-nowrap" data-stage="ALL">Todas las etapas</button>
        <button class="stage-btn bg-slate-800 text-slate-400 px-3 py-1.5 rounded-lg whitespace-nowrap border border-slate-700" data-stage="PRIMERA_CAPA">1. Capa y Adherencia</button>
        <button class="stage-btn bg-slate-800 text-slate-400 px-3 py-1.5 rounded-lg whitespace-nowrap border border-slate-700" data-stage="EXTRUSION">2. Extrusión y Flujo</button>
        <button class="stage-btn bg-slate-800 text-slate-400 px-3 py-1.5 rounded-lg whitespace-nowrap border border-slate-700" data-stage="TERMICA">3. Térmica / Humedad</button>
        <button class="stage-btn bg-slate-800 text-slate-400 px-3 py-1.5 rounded-lg whitespace-nowrap border border-slate-700" data-stage="CINEMATICA">4. Mecánica</button>
        <button class="stage-btn bg-slate-800 text-slate-400 px-3 py-1.5 rounded-lg whitespace-nowrap border border-slate-700" data-stage="SLICER">5. Slicer / Parámetros</button>
      </div>

      <!-- Result List Container -->
      <div id="troubleshoot-cards" class="space-y-4">
        <!-- Render dinámico desde troubleshooting.json -->
      </div>
    </section>

  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 flex justify-around py-2 z-50">
    <a href="#" class="flex flex-col items-center text-xs text-brand-500">
      <span>🔬</span>
      <span>Diagnóstico</span>
    </a>
    <a href="#" class="flex flex-col items-center text-xs text-slate-400">
      <span>🎛️</span>
      <span>Slicers</span>
    </a>
    <a href="#" class="flex flex-col items-center text-xs text-slate-400">
      <span>👤</span>
      <span>Perfil</span>
    </a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
